version: '3.8'

services:
  web:
    build: .
    container_name: pollme_web
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=production-django-insecure-key-change-me
      - ALLOWED_HOSTS=*
    volumes:
      - sqlite_data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  sqlite_data:
