{% extends 'base.html' %}

{% block title %}Sign In | PollMe{% endblock title %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md glass-panel p-8 sm:p-10 rounded-2xl shadow-2xl border border-dark-border/80">
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-2xl bg-primary/20 text-primary-light flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-lock text-xl"></i>
            </div>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-white">Welcome Back</h2>
            <p class="text-sm text-slate-400 mt-2">Sign in to your PollMe account to manage your polls</p>
        </div>

        <form method="POST" action="{% url 'accounts:login' %}" class="space-y-5">
            {% csrf_token %}
            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <div class="space-y-1.5">
                <label for="id_username" class="block text-sm font-medium text-slate-300">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
                        <i class="fas fa-user"></i>
                    </span>
                    <input type="text" name="username" id="id_username" required autofocus
                           class="w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:border-primary focus:ring-2 focus:ring-primary/40 transition-colors"
                           placeholder="Enter your username">
                </div>
            </div>

            <div class="space-y-1.5">
                <label for="id_password" class="block text-sm font-medium text-slate-300">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
                        <i class="fas fa-key"></i>
                    </span>
                    <input type="password" name="password" id="id_password" required
                           class="w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:border-primary focus:ring-2 focus:ring-primary/40 transition-colors"
                           placeholder="Enter your password">
                </div>
            </div>

            <button type="submit"
                    class="w-full py-3.5 px-4 bg-primary hover:bg-primary-dark text-white rounded-xl font-semibold shadow-lg shadow-primary/25 transition-all duration-200 transform hover:-translate-y-0.5 flex items-center justify-center space-x-2">
                <i class="fas fa-sign-in-alt"></i>
                <span>Sign In</span>
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-800 text-center text-sm text-slate-400">
            Don't have an account yet?
            <a href="{% url 'accounts:register' %}" class="text-primary-light hover:text-white font-semibold ml-1">
                Sign up free
            </a>
        </div>
    </div>
</div>
{% endblock content %}
